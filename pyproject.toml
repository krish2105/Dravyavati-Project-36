[project]
name = "dravyavati-atlas"
version = "0.1.0"
description = "Chainage-indexed geospatial constraint screening for the proposed Dravyavati River corridor, Jaipur"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "osmnx>=1.9",
    "pyarrow>=15.0",
    "requests>=2.31",
    "centerline>=1.1",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
